<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سبحتي</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100vh; margin: 0;
            background-color: #1a1a1a; color: white; font-family: sans-serif;
        }
        .counter-box {
            text-align: center; background: #333; padding: 40px;
            border-radius: 50%; width: 180px; height: 180px;
            display: flex; flex-direction: column; justify-content: center;
            border: 6px solid #ff4500; box-shadow: 0 0 20px rgba(255, 69, 0, 0.3);
            cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        #number { font-size: 70px; margin: 0; font-weight: bold; }
        .reset-btn {
            margin-top: 40px; padding: 10px 30px; background: #555;
            color: white; border: none; border-radius: 20px; font-size: 16px;
        }
    </style>
</head>
<body>

    <h2 style="margin-bottom: 30px;">سبحة إلكترونية</h2>

    <div class="counter-box" onclick="countUp()">
        <p id="number">0</p>
        <span>اضغط للتسبيح</span>
    </div>

    <button class="reset-btn" onclick="resetCount()">تصفير العداد</button>

    <script>
        // كود حفظ الرقم في الذاكرة
        let count = localStorage.getItem("savedCount") ? parseInt(localStorage.getItem("savedCount")) : 0;
        const numberDisplay = document.getElementById("number");
        
        // عرض الرقم المحفوظ فور فتح التطبيق
        numberDisplay.innerText = count;

        function countUp() {
            count++;
            numberDisplay.innerText = count;
            localStorage.setItem("savedCount", count); // حفظ

            if (navigator.vibrate) {
                navigator.vibrate(40); // هزة خفيفة
            }
        }

        function resetCount() {
            if(confirm("هل تريد تصفير العداد؟")) {
                count = 0;
                localStorage.setItem("savedCount", 0);
                numberDisplay.innerText = count;
            }
        }
    </script>
</body>
</html>
